<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{TITLE}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
      }
      [data-composition-id="clip-root"] {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #base-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }
      #title-card {
        position: absolute;
        left: 50%;
        top: 1152px;
        width: 1000px;
        height: 180px;
        transform: translate(-50%, -50%);
        transform-origin: 50% 50%;
        z-index: 20;
        opacity: 0;
        filter: drop-shadow(0 16px 46px rgba(0, 0, 0, .42));
      }
      .caption {
        position: absolute;
        left: 50%;
        top: var(--caption-y, 1110px);
        transform: translate(-50%, -50%);
        z-index: 30;
        width: 980px;
        text-align: center;
        color: #fff;
        font-weight: 900;
        font-size: 54px;
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
        font-family: Arial, Helvetica, sans-serif;
        text-shadow:
          -3px -3px 0 #000,
           3px -3px 0 #000,
          -3px  3px 0 #000,
           3px  3px 0 #000,
           0    4px 0 #000;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div data-composition-id="clip-root" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      <video id="base-video" data-start="0" data-duration="{{DURATION}}" data-track-index="0" src="media/base.mp4" muted playsinline></video>
      <audio id="base-audio" data-start="0" data-duration="{{DURATION}}" data-track-index="1" src="media/base.mp4"></audio>
      <img id="title-card" data-start="0" data-duration="{{TITLE_DURATION}}" data-track-index="2" src="media/title_card_reference_v2.png" alt="" />
      {{CAPTION_DIVS}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title-card", { opacity: 0, y: 28, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "power3.out" }, 0);
      tl.to("#title-card", { opacity: 0, y: -18, duration: 0.24, ease: "power2.in" }, Math.max(0, {{TITLE_DURATION}} - 0.25));
      window.__hyperframesTimeline = tl;
    </script>
  </body>
</html>
